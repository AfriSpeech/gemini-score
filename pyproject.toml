[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-score"
version = "0.1.0"
description = "Semantic MT evaluation metric for African languages using Gemini back-translation and Gemini embeddings"
readme = "README.md"
authors = [
    { name = "Mich-Seth Owusu" }
]
license = { text = "MIT" }
keywords = [
    "machine-translation",
    "evaluation",
    "gemini",
    "bleu",
    "african-languages",
    "nlp",
    "embeddings",
    "sentence-similarity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "google-genai>=0.1.1",
    "afriso>=1.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
pandas = [
    "pandas>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pandas>=1.3.0",
]

[project.scripts]
gemini-score = "gemini_score.cli:main"
geminiscore = "gemini_score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
